<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>
      The Current Time Displayed as the Value of Light From a Seven Segment Display
    </title>

    <style>
      body {
        background-color: #0B0B0B;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        box-sizing: border-box;
      }

      .clock {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: clamp(12px, 5vw, 100px);
        width: 100%;
      }

      .square {
        width: min(18vw, 150px);
        max-width: calc((100vw - 48px - 15vw) / 4);
        aspect-ratio: 1 / 1;
        flex: 0 1 150px;
      }

    </style>
  </head>

  <body>
    <div class="clock">
      <div class="square" id="hour1"></div>
      <div class="square" id="hour2"></div>
      <div class="square" id="minute1"></div>
      <div class="square" id="minute2"></div>
    </div>

    <script>
      function getColor(number) {
        const colors = [
          "#bbb6b6",
          "#232122",
          "#888383",
          "#888383",
          "#565052",
          "#888383",
          "#bbb6b6",
          "#3a3637",
          "#ede8e6",
          "#bbb6b6"
        ];

        return colors[number];
      }

      function updateColors() {
        const date = new Date();

        const hour1 = Math.floor(date.getHours() / 10);
        const hour2 = date.getHours() % 10;
        const minute1 = Math.floor(date.getMinutes() / 10);
        const minute2 = date.getMinutes() % 10;

        document.getElementById("hour1").style.backgroundColor = getColor(hour1);
        document.getElementById("hour2").style.backgroundColor = getColor(hour2);
        document.getElementById("minute1").style.backgroundColor = getColor(minute1);
        document.getElementById("minute2").style.backgroundColor = getColor(minute2);
      }

      function scheduleUpdate() {
        updateColors();

        const now = new Date();
        const millisecondsUntilNextMinute =
          60000 - (now.getSeconds() * 1000 + now.getMilliseconds());

        setTimeout(scheduleUpdate, millisecondsUntilNextMinute);
      }

      scheduleUpdate();
    </script>
  </body>
</html>
